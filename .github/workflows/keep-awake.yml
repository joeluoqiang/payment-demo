name: Render Keep Alive

on:
  schedule:
    # 每 10 分钟触发一次 (UTC时区)，更符合Render免费版15分钟休眠规则
    - cron: '*/10 * * * *'
  # 支持手动触发
  workflow_dispatch: {}

# 并发控制：确保同一时间只有一个唤醒任务在运行
concurrency:
  group: render-keep-alive
  cancel-in-progress: true

jobs:
  ping-services:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render services in parallel
        run: |
          echo "[$(date -u)] Starting Render keep-alive pings..."
          
          # 定义ping函数
          ping_service() {
            local service_name=$1
            local service_url=$2
            local max_attempts=2
            local timeout=15
            local retry_delay=5
            
            echo "[$(date -u)] Pinging $service_name at $service_url..."
            
            for i in $(seq 1 $max_attempts); do
              echo "[$(date -u)] $service_name: Attempt $i/$max_attempts..."
              
              # 使用curl发送请求，增加超时时间，记录详细信息
              response=$(curl -w "%{http_code} %{time_total}s" -o /tmp/response.txt -s -m $timeout "$service_url")
              status_code=$(echo $response | cut -d' ' -f1)
              response_time=$(echo $response | cut -d' ' -f2)
              
              if [ "$status_code" = "200" ]; then
                echo "[$(date -u)] ✓ $service_name: Successful (HTTP $status_code, ${response_time}s)"
                return 0
              else
                echo "[$(date -u)] ✗ $service_name: Failed (HTTP $status_code, ${response_time}s)"
                
                if [ $i -lt $max_attempts ]; then
                  echo "[$(date -u)] $service_name: Retrying in $retry_delay seconds..."
                  sleep $retry_delay
                else
                  echo "[$(date -u)] ✗ $service_name: All $max_attempts attempts failed"
                  return 1
                fi
              fi
            done
          }
          
          # 并行执行ping请求
          ping_service "Backend" "https://payment-demo-backend-si0i.onrender.com/health" &
          ping_service "Frontend" "https://payment-demo-zeta.vercel.app/" &
          
          # 等待所有ping请求完成
          wait
          
          echo "[$(date -u)] Render keep-alive pings completed!"
          # 总是返回成功，因为唤醒任务的目的是尝试唤醒服务，即使失败也不应该导致工作流失败
          exit 0

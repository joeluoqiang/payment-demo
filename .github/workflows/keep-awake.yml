name: Render Keep Alive

on:
  schedule:
    # 每 5 分钟触发一次 (UTC时区)
    - cron: '*/5 * * * *'
  # 支持手动触发
  workflow_dispatch: {}

# 并发控制：确保同一时间只有一个唤醒任务在运行
concurrency:
  group: render-keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Send ping to Render backend service
        run: |
          echo "[$(date -u)] Starting backend ping..."
          # 使用timeout和重试机制，最多重试3次，每次间隔10秒
          for i in {1..3}; do
            echo "[$(date -u)] Attempt $i: Pinging backend..."
            response=$(curl -w "%{http_code}" -o /dev/null -s -m 10 https://payment-demo-backend-si0i.onrender.com/health)
            if [ "$response" = "200" ]; then
              echo "[$(date -u)] ✓ Backend ping successful (HTTP $response)"
              exit 0
            else
              echo "[$(date -u)] ✗ Backend ping failed with HTTP $response"
              if [ $i -lt 3 ]; then
                echo "[$(date -u)] Retrying in 10 seconds..."
                sleep 10
              fi
            fi
          done
          echo "[$(date -u)] ✗ All backend ping attempts failed"
          exit 1
      
      - name: Send ping to Render frontend service
        run: |
          echo "[$(date -u)] Starting frontend ping..."
          # 使用timeout和重试机制，最多重试3次，每次间隔10秒
          for i in {1..3}; do
            echo "[$(date -u)] Attempt $i: Pinging frontend..."
            response=$(curl -w "%{http_code}" -o /dev/null -s -m 10 https://payment-demo-zeta.vercel.app/)
            if [ "$response" = "200" ]; then
              echo "[$(date -u)] ✓ Frontend ping successful (HTTP $response)"
              exit 0
            else
              echo "[$(date -u)] ✗ Frontend ping failed with HTTP $response"
              if [ $i -lt 3 ]; then
                echo "[$(date -u)] Retrying in 10 seconds..."
                sleep 10
              fi
            fi
          done
          echo "[$(date -u)] ✗ All frontend ping attempts failed"
          exit 1

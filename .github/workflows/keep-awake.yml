name: Render Keep Alive

on:
  schedule:
    # 每 7 分钟触发一次
    - cron: '*/7 * * * *'
  # 支持手动触发
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send ping to Render backend service
        run: |
          curl -fsS https://payment-demo-backend-si0i.onrender.com/health || true
      - name: Send ping to Render frontend service
        run: |
          curl -fsS https://payment-demo-zeta.vercel.app/ || true
